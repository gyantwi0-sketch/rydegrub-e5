name: Refresh Supabase auth lockfile (one-time)

on:
  push:
    branches:
      - feat/supabase-auth-migration
    paths:
      - .github/workflows/refresh-supabase-lockfile.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-auth-migration
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Update lockfile on migration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(auth): regenerate Supabase dependency lockfile'
            git push origin HEAD:feat/supabase-auth-migration
          fi
      - run: pnpm audit --audit-level high
