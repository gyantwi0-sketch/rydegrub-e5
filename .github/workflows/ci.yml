name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Generate CycloneDX dependency SBOM
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out sbom.cdx.json
      - name: Verify dependency SBOM
        run: node scripts/verify-sbom.mjs sbom.cdx.json
      - name: Retain SBOM for security review
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke

