name: Refresh popup fix lockfile (one-time)

on:
  push:
    branches:
      - fix/firebase-google-popup-coop-csp
    paths:
      - .github/workflows/refresh-popup-lockfile.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firebase-google-popup-coop-csp
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit updated lockfile on this fix branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): regenerate patched pnpm lockfile'
            git push origin HEAD:fix/firebase-google-popup-coop-csp
          fi
      - run: pnpm audit --audit-level high
